<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- aluminium body -->
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f7"/>
      <stop offset="0.5" stop-color="#d9dce1"/>
      <stop offset="1" stop-color="#b9bdc4"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8e939b" stop-opacity="0.6"/>
    </linearGradient>
    <!-- recessed well around the driver -->
    <radialGradient id="well" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0.80" stop-color="#2a2d33"/>
      <stop offset="1" stop-color="#9aa0a8"/>
    </radialGradient>
    <!-- surround (rubber edge) -->
    <radialGradient id="surround" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#3b3f47"/>
      <stop offset="0.7" stop-color="#1d1f24"/>
      <stop offset="1" stop-color="#0d0e11"/>
    </radialGradient>
    <!-- cone -->
    <radialGradient id="cone" cx="0.5" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#4a4f58"/>
      <stop offset="0.55" stop-color="#25282e"/>
      <stop offset="1" stop-color="#121317"/>
    </radialGradient>
    <!-- dust cap -->
    <radialGradient id="cap" cx="0.42" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#8d939c"/>
      <stop offset="0.45" stop-color="#4b5058"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </radialGradient>
    <!-- bass glow -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.72" stop-color="#3fd0ff" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#3fd0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3fd0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="brushed" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.002 0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="g2"><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feComposite in="g2" in2="SourceGraphic" operator="in"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- tile -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#alu)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#fff" filter="url(#brushed)" clip-path="url(#tile)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <g transform="translate(512 512) scale(0.86) translate(-512 -512)">
  <!-- bass ripple rings on the aluminium -->
  <g fill="none" stroke="#7d838c" stroke-opacity="0.35">
    <circle cx="512" cy="512" r="372" stroke-width="5"/>
    <circle cx="512" cy="512" r="396" stroke-width="3" stroke-opacity="0.2"/>
  </g>

  <!-- glow behind the driver -->
  <circle cx="512" cy="512" r="380" fill="url(#glow)"/>

  <!-- recessed well -->
  <circle cx="512" cy="512" r="330" fill="url(#well)"/>
  <!-- surround -->
  <circle cx="512" cy="512" r="300" fill="url(#surround)"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="4"/>
  <!-- surround highlight (upper arc) -->
  <path d="M 262 470 A 258 258 0 0 1 762 470" fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="22" stroke-linecap="round"/>
  <!-- cone -->
  <circle cx="512" cy="512" r="252" fill="url(#cone)"/>
  <g fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="3">
    <circle cx="512" cy="512" r="210"/>
    <circle cx="512" cy="512" r="168"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="3">
    <circle cx="512" cy="510" r="212"/>
    <circle cx="512" cy="510" r="170"/>
  </g>
  <!-- dust cap -->
  <circle cx="512" cy="512" r="112" fill="url(#cap)"/>
  <circle cx="512" cy="512" r="112" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="3"/>
  <ellipse cx="478" cy="468" rx="46" ry="26" fill="#fff" fill-opacity="0.18" transform="rotate(-25 478 468)"/>
  </g>
  <!-- corner screws -->
  <defs>
    <radialGradient id="screw" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#b7bcc3"/>
      <stop offset="1" stop-color="#7d838c"/>
    </radialGradient>
  </defs>
  <g>
    <circle cx="214" cy="214" r="22" fill="url(#screw)" stroke="#6f757e" stroke-width="2"/>
    <path d="M 202 214 L 226 214 M 214 202 L 214 226" stroke="#5d636b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="810" cy="214" r="22" fill="url(#screw)" stroke="#6f757e" stroke-width="2"/>
    <path d="M 798 214 L 822 214 M 810 202 L 810 226" stroke="#5d636b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="214" cy="810" r="22" fill="url(#screw)" stroke="#6f757e" stroke-width="2"/>
    <path d="M 202 810 L 226 810 M 214 798 L 214 822" stroke="#5d636b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="810" cy="810" r="22" fill="url(#screw)" stroke="#6f757e" stroke-width="2"/>
    <path d="M 798 810 L 822 810 M 810 798 L 810 822" stroke="#5d636b" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
