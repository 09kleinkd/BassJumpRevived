# Xcode project definition. Generate with:  xcodegen generate
name: BassJump
options:
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: BWZWZZ6FB7          # KSQ Studios LLC
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "5"
    ENABLE_HARDENED_RUNTIME: NO
targets:
  BassJump:
    type: application
    platform: macOS
    sources:
      - path: Sources/BassJumpRevived
      - path: Resources/AppIcon.icon
    settings:
      base:
        PRODUCT_NAME: BassJump
        PRODUCT_BUNDLE_IDENTIFIER: local.bassjump.revived
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BassJumpControls
        embed: true
        codeSign: true
  BassJumpControls:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Extensions/BassJumpControls
        excludes: ["Info.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_NAME: BassJumpControls
        PRODUCT_BUNDLE_IDENTIFIER: local.bassjump.revived.controls
        INFOPLIST_FILE: Extensions/BassJumpControls/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/BassJumpControls/BassJumpControls.entitlements
        SKIP_INSTALL: YES
